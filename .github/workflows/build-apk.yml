name: Build Ranked Draft Simulator APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/rankeddraft/simulator
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RankedDraftSimulator"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rankeddraft.simulator'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rankeddraft.simulator'
                  minSdk 23
                  targetSdk 35
                  versionCode 28
                  versionName '28.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:label="Ranked Draft Simulator"
                  android:icon="@drawable/app_icon"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="unspecified"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#000000</item>
                  <item name="android:windowNoTitle">true</item>
              </style>

          </resources>
          EOF

      - name: Download original app icon
        run: |
          wget -q https://sparkling-biscochitos-e43888.netlify.app/icon-192.png \
            -O app/src/main/res/drawable/app_icon.png

      - name: Create WebView launcher
        run: |
          cat > app/src/main/java/com/rankeddraft/simulator/MainActivity.java <<'EOF'
          package com.rankeddraft.simulator;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.ServiceWorkerClient;
          import android.webkit.ServiceWorkerController;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {
                          return false;
                      }
                  });

                  ServiceWorkerController controller =
                          ServiceWorkerController.getInstance();

                  controller.setServiceWorkerClient(new ServiceWorkerClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              WebResourceRequest request) {
                          return null;
                      }
                  });

                  webView.loadUrl(
                      "https://sparkling-biscochitos-e43888.netlify.app/"
                  );

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
             
